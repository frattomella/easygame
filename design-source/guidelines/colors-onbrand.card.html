<!-- @dsCard group="Colors" viewport="700x160" name="On-brand alphas" subtitle="White alphas for text and fills on blue surfaces" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--eg-surface-card);font-family:var(--eg-font-brand);color:var(--eg-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--eg-radius-md);padding:10px;min-width:104px;display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--eg-text-caption);font-weight:600}.v{font:var(--eg-text-caption);opacity:.8;font-variant-numeric:tabular-nums}.lbl{font:var(--eg-text-caption);color:var(--eg-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}</style></head><body><div style="background:var(--eg-primary);border-radius:var(--eg-radius-lg);padding:16px;display:flex;gap:10px;flex-wrap:wrap">
<div class="sw" style="background:rgba(255,255,255,.14);color:#fff"><span class="n">fill</span><span class="v">white 14%</span></div>
<div class="sw" style="background:rgba(255,255,255,.18);color:#fff"><span class="n">fill strong</span><span class="v">white 18%</span></div>
<div class="sw" style="background:transparent;color:rgba(255,255,255,.82)"><span class="n">text muted</span><span class="v">white 82%</span></div>
<div class="sw" style="background:transparent;color:rgba(255,255,255,.64)"><span class="n">tab inactive</span><span class="v">white 64%</span></div></div></body></html>
