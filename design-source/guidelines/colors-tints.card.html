<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--eg-surface-card);font-family:var(--eg-font-brand);color:var(--eg-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--eg-radius-md);padding:10px;min-width:104px;display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--eg-text-caption);font-weight:600}.v{font:var(--eg-text-caption);opacity:.8;font-variant-numeric:tabular-nums}.lbl{font:var(--eg-text-caption);color:var(--eg-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}</style></head><body><div class="g"><div class="sw" style="background:rgba(37,99,235,.1);color:#2563eb;"><span class="n">tint primary</span><span class="v">rgba(37,99,235,.1)</span></div><div class="sw" style="background:rgba(34,197,94,.1);color:#16a34a;"><span class="n">tint success</span><span class="v">rgba(34,197,94,.1)</span></div><div class="sw" style="background:rgba(245,158,11,.1);color:#b45309;"><span class="n">tint warning</span><span class="v">rgba(245,158,11,.1)</span></div><div class="sw" style="background:rgba(239,68,68,.1);color:#dc2626;"><span class="n">tint destructive</span><span class="v">rgba(239,68,68,.1)</span></div></div></body></html>
