<!-- @dsCard group="Colors" viewport="700x150" name="Status pill ramp" subtitle="Solid fills, white labels — tints are deprecated" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--eg-surface-card);font-family:var(--eg-font-brand);color:var(--eg-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--eg-radius-md);padding:10px;min-width:104px;display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--eg-text-caption);font-weight:600}.v{font:var(--eg-text-caption);opacity:.8;font-variant-numeric:tabular-nums}.lbl{font:var(--eg-text-caption);color:var(--eg-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}</style></head><body><div class="g"><div class="sw" style="background:#1d4ed8;color:#fff"><span class="n">pill info</span><span class="v">#1D4ED8</span></div><div class="sw" style="background:#15803d;color:#fff"><span class="n">pill success</span><span class="v">#15803D</span></div><div class="sw" style="background:#b45309;color:#fff"><span class="n">pill warning</span><span class="v">#B45309</span></div><div class="sw" style="background:#b91c1c;color:#fff"><span class="n">pill danger</span><span class="v">#B91C1C</span></div><div class="sw" style="background:#9a3412;color:#fff"><span class="n">pill match</span><span class="v">#9A3412</span></div><div class="sw" style="background:rgba(11,26,58,.09);color:#0b1a3a;border:1px solid rgba(11,26,58,.18)"><span class="n">pill neutral</span><span class="v">ink 9% / 18%</span></div></div></body></html>
