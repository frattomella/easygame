<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--eg-surface-card);font-family:var(--eg-font-brand);color:var(--eg-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--eg-radius-md);padding:10px;min-width:104px;display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--eg-text-caption);font-weight:600}.v{font:var(--eg-text-caption);opacity:.8;font-variant-numeric:tabular-nums}.lbl{font:var(--eg-text-caption);color:var(--eg-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}</style></head><body><div class="g"><div class="sw" style="background:#22c55e;color:#fff;"><span class="n">success</span><span class="v">#22c55e</span></div><div class="sw" style="background:#f59e0b;color:#fff;"><span class="n">warning</span><span class="v">#f59e0b</span></div><div class="sw" style="background:#ef4444;color:#fff;"><span class="n">destructive</span><span class="v">#ef4444</span></div></div></body></html>
