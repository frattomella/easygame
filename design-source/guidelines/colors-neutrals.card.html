<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--eg-surface-card);font-family:var(--eg-font-brand);color:var(--eg-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--eg-radius-md);padding:10px;min-width:104px;display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--eg-text-caption);font-weight:600}.v{font:var(--eg-text-caption);opacity:.8;font-variant-numeric:tabular-nums}.lbl{font:var(--eg-text-caption);color:var(--eg-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}</style></head><body><div class="g"><div class="sw" style="background:#ffffff;color:#0f172a;border:1px solid var(--eg-border)"><span class="n">white</span><span class="v">#ffffff</span></div><div class="sw" style="background:#f8fafc;color:#0f172a;"><span class="n">slate-50</span><span class="v">#f8fafc</span></div><div class="sw" style="background:#f1f5f9;color:#0f172a;"><span class="n">slate-100</span><span class="v">#f1f5f9</span></div><div class="sw" style="background:#e2e8f0;color:#0f172a;"><span class="n">slate-200</span><span class="v">#e2e8f0</span></div><div class="sw" style="background:#94a3b8;color:#0f172a;"><span class="n">slate-400</span><span class="v">#94a3b8</span></div><div class="sw" style="background:#64748b;color:#fff;"><span class="n">slate-500</span><span class="v">#64748b</span></div><div class="sw" style="background:#334155;color:#fff;"><span class="n">slate-700</span><span class="v">#334155</span></div><div class="sw" style="background:#1e293b;color:#fff;"><span class="n">slate-800</span><span class="v">#1e293b</span></div><div class="sw" style="background:#0f172a;color:#fff;"><span class="n">slate-900</span><span class="v">#0f172a</span></div><div class="sw" style="background:#020617;color:#fff;"><span class="n">slate-950</span><span class="v">#020617</span></div></div></body></html>
