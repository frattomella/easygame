<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--eg-surface-card);font-family:var(--eg-font-brand);color:var(--eg-text-primary)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{border-radius:var(--eg-radius-md);padding:10px;min-width:104px;display:flex;flex-direction:column;justify-content:flex-end;height:84px}.n{font:var(--eg-text-caption);font-weight:600}.v{font:var(--eg-text-caption);opacity:.8;font-variant-numeric:tabular-nums}.lbl{font:var(--eg-text-caption);color:var(--eg-text-secondary);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px}</style></head><body><div style="display:flex;gap:16px;align-items:flex-start">
<div style="flex:1;background:#fff;border-radius:var(--eg-radius-md);box-shadow:var(--eg-shadow-card);padding:16px"><div class="n">card</div><div class="v" style="color:var(--eg-text-secondary)">0 2px 8px rgba(0,0,0,.08)</div></div>
<div style="flex:1;background:#fff;border-radius:var(--eg-radius-md);box-shadow:var(--eg-shadow-card-large);padding:16px"><div class="n">card large / sheet</div><div class="v" style="color:var(--eg-text-secondary)">0 4px 12px rgba(0,0,0,.12)</div></div>
<div style="flex:1;background:var(--eg-brand-gradient);color:#fff;border-radius:9999px;box-shadow:var(--eg-shadow-tabbar);padding:16px"><div class="n">tab bar</div><div class="v">0 14px 20px rgba(2,6,23,.24)</div></div></div></body></html>
