<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/easygame-design-system-84532636-540e-4f5d-91bf-75957af5e007/tokens/fonts.css">
<link rel="stylesheet" href="_ds/easygame-design-system-84532636-540e-4f5d-91bf-75957af5e007/styles.css">
<style>body{margin:0;font-family:Poppins,system-ui,sans-serif;color:#0b1a3a}</style>
</helmet>

<div style="flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden">

  <div style="flex:none;display:flex;align-items:center;gap:18px;padding:18px 28px 16px">
    <div style="width:74px;height:74px;flex:none;background:linear-gradient(160deg,#0b1a3a,#1b3576);border-radius:22px 22px 8px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 14px 28px -14px rgba(11,26,58,.5)">
      <span style="font:800 24px/1 Poppins,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:-.03em;color:#fff">14</span>
      <span style="font:700 8.5px/1 Poppins,sans-serif;letter-spacing:.12em;color:rgba(255,255,255,.6)">ALA</span>
    </div>
    <div style="min-width:0">
      <div style="font:700 10px/1 Poppins,sans-serif;letter-spacing:.12em;color:rgba(11,26,58,.42)">ATLETA · TESSERATO 2026/2027</div>
      <h1 style="margin:9px 0 0;font:800 28px/1.05 Poppins,sans-serif;letter-spacing:-.02em">Izzo Aldo</h1>
      <div style="margin-top:9px;display:flex;align-items:center;gap:8px">
        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:rgba(37,99,235,.1);border:1px solid rgba(37,99,235,.28);border-radius:10px 10px 4px 10px;font:700 9.5px/1 Poppins,sans-serif;letter-spacing:.08em;color:#1d4ed8"><span style="width:5px;height:5px;border-radius:999px;background:#2563eb"></span>AQUILOTTI · PRIMARIA</span>
        <span style="display:inline-flex;align-items:center;gap:6px;padding:4px 9px;background:rgba(21,128,61,.1);border:1px solid rgba(21,128,61,.3);border-radius:10px 10px 4px 10px;font:700 9.5px/1 Poppins,sans-serif;letter-spacing:.08em;color:#15803d"><span style="width:5px;height:5px;border-radius:999px;background:#15803d"></span>ATTIVO</span>
        <span style="font:400 11.5px/1 Poppins,sans-serif;color:rgba(11,26,58,.55)">1 gen 2016 · Scauri</span>
      </div>
    </div>
    <div style="margin-left:auto;display:flex;align-items:center;gap:9px">
      <button style="height:38px;padding:0 14px 0 11px;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(11,26,58,.14);border-radius:13px 13px 4px 13px;box-shadow:inset 0 1px 0 #fff,0 1px 2px rgba(11,26,58,.06);font:600 12.5px/1 Poppins,sans-serif;color:#0b1a3a;cursor:pointer"><span style="width:15px;height:15px;background:rgba(11,26,58,.6);mask:url(icons/lock-closed-outline.svg) center/contain no-repeat"></span>Accesso EasyGame</button>
      <button style="height:38px;padding:0 14px 0 11px;display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(185,28,28,.35);border-radius:13px 13px 4px 13px;box-shadow:inset 0 1px 0 #fff;font:600 12.5px/1 Poppins,sans-serif;color:#b91c1c;cursor:pointer"><span style="width:15px;height:15px;background:#b91c1c;mask:url(icons/close-circle-outline.svg) center/contain no-repeat"></span>Elimina</button>
    </div>
  </div>

  <div style="flex:none;padding:0 28px 12px">
    <div style="display:inline-flex;align-items:center;gap:2px;padding:4px;background:#e9eef9;border:1px solid rgba(11,26,58,.1);border-radius:14px 14px 5px 14px">
      <sc-if value="{{ isGenerale }}" hint-placeholder-val="{{ true }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Generale</span></sc-if>
      <sc-if value="{{ notGenerale }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Generale</span></sc-if>
      <sc-if value="{{ isContatti }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Contatti</span></sc-if>
      <sc-if value="{{ notContatti }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Contatti</span></sc-if>
      <sc-if value="{{ isSanitari }}"><span style="display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Dati Sanitari<span style="width:6px;height:6px;border-radius:999px;background:#b91c1c"></span></span></sc-if>
      <sc-if value="{{ notSanitari }}"><span style="display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Dati Sanitari<span style="width:6px;height:6px;border-radius:999px;background:#b91c1c"></span></span></sc-if>
      <sc-if value="{{ isIscrizione }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Iscrizione</span></sc-if>
      <sc-if value="{{ notIscrizione }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Iscrizione</span></sc-if>
      <sc-if value="{{ isAbbigliamento }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Abbigliamento</span></sc-if>
      <sc-if value="{{ notAbbigliamento }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Abbigliamento</span></sc-if>
      <sc-if value="{{ isDocumenti }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Documenti</span></sc-if>
      <sc-if value="{{ notDocumenti }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Documenti</span></sc-if>
      <sc-if value="{{ isAnalitiche }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Analitiche</span></sc-if>
      <sc-if value="{{ notAnalitiche }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Analitiche</span></sc-if>
      <sc-if value="{{ isLavoro }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;background:#fff;border-radius:11px 11px 4px 11px;box-shadow:0 2px 5px rgba(11,26,58,.14);font:700 12px/1 Poppins,sans-serif;color:#12265a">Lavoro e compensi</span></sc-if>
      <sc-if value="{{ notLavoro }}"><span style="display:inline-flex;align-items:center;height:32px;padding:0 14px;font:500 12px/1 Poppins,sans-serif;color:rgba(11,26,58,.6)">Lavoro e compensi</span></sc-if>
    </div>
  </div>

  <div style="flex:1;min-height:0;overflow:hidden;padding:0 28px 22px;display:flex;flex-direction:column;gap:14px">{{ kids }}</div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1104,&quot;height&quot;:793},&quot;tab&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;generale&quot;,&quot;contatti&quot;,&quot;sanitari&quot;,&quot;iscrizione&quot;,&quot;abbigliamento&quot;,&quot;documenti&quot;,&quot;analitiche&quot;,&quot;lavoro&quot;],&quot;default&quot;:&quot;generale&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const t = this.props.tab ?? "generale";
    const is = (k) => t === k;
    return {
      kids: this.props.children,
      isGenerale: is("generale"), notGenerale: !is("generale"),
      isContatti: is("contatti"), notContatti: !is("contatti"),
      isSanitari: is("sanitari"), notSanitari: !is("sanitari"),
      isIscrizione: is("iscrizione"), notIscrizione: !is("iscrizione"),
      isAbbigliamento: is("abbigliamento"), notAbbigliamento: !is("abbigliamento"),
      isDocumenti: is("documenti"), notDocumenti: !is("documenti"),
      isAnalitiche: is("analitiche"), notAnalitiche: !is("analitiche"),
      isLavoro: is("lavoro"), notLavoro: !is("lavoro")
    };
  }
}
</script>
</body>
</html>
