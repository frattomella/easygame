name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Un solo run per ref: un push successivo annulla il precedente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web App (src/)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Il build importa src/lib/server/prisma.ts, che richiede DATABASE_URL.
      # Sono valori fittizi: la CI non si connette a nessun database e non deve
      # avere accesso a Neon. Vedi docs/knowledge-base/13-environments.md.
      DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"
      DIRECT_URL: "postgresql://ci:ci@127.0.0.1:5432/ci?sslmode=disable"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      # Il build va prima del typecheck: `next-env.d.ts` e gitignored (default
      # di create-next-app) e senza di esso `tsc` non trova le dichiarazioni
      # dei moduli immagine. Next lo rigenera a ogni build.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Nessun codice irraggiungibile
        run: npx tsc --noEmit --incremental false --allowUnreachableCode false

  # ---------------------------------------------------------------------
  # Le sonde di Wave 6.
  #
  # Una revisione ha misurato che, di ventuno difese della Wave, **nove**
  # erano viste soltanto da `wave6:security` — che nessuno eseguiva
  # automaticamente. Cioe: nove regole erano presidiate da un comando che
  # bisognava ricordarsi di lanciare a mano, e cio che passa `npm test`
  # arriva in produzione.
  #
  # Le sonde girano contro un Postgres vero perche misurano cose che il
  # doppio di Prisma non sa valutare — i filtri di relazione del perimetro,
  # per dirne una. Il database e un servizio effimero del runner: non tocca
  # nessun ambiente, e le sonde si seminano da sole.
  # ---------------------------------------------------------------------
  sonde:
    name: Sonde Wave 6 (UAT, ruoli, sicurezza)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: easygame
          POSTGRES_PASSWORD: easygame
          POSTGRES_DB: easygame_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: "postgresql://easygame:easygame@127.0.0.1:5432/easygame_ci?sslmode=disable"
      DIRECT_URL: "postgresql://easygame:easygame@127.0.0.1:5432/easygame_ci?sslmode=disable"
      # `scripts/db-guard.mjs` blocca gli script di scrittura se questo non
      # vale `development`. Qui il database e effimero e del runner.
      EASYGAME_DB_ENV: "development"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Schema
        run: npx prisma migrate deploy

      - name: Sonda UAT
        run: npm run wave6:uat

      - name: Sonda ruoli e permessi
        run: npm run wave6:roles

      - name: Sonda di sicurezza
        run: npm run wave6:security

  mobile:
    name: Mobile App (easygamemobile/)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: easygamemobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: easygamemobile/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check:types

      - name: Lint
        run: npm run lint

  guardrails:
    name: Guardrail di sicurezza
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Nessun file .env reale committato
        run: |
          found=$(git ls-files | grep -E '^(.*/)?\.env($|\.local$|\.production$)' || true)
          if [ -n "$found" ]; then
            echo "File .env committati:"; echo "$found"; exit 1
          fi
          echo "OK: solo template .env*.example"

      - name: Nessun segreto evidente nei file tracciati
        run: |
          # Questo file e escluso perche contiene il pattern stesso e
          # altrimenti si auto-segnalerebbe.
          pattern='(sk_live_|sk_test_|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{20,}|github_pat_|xox[baprs]-|AIza[0-9A-Za-z_-]{30,}|-----BEGIN [A-Z ]*PRIVATE KEY|SG\.[A-Za-z0-9_-]{20,})'
          if git grep -nIE "$pattern" -- . \
              ':!package-lock.json' \
              ':!easygamemobile/package-lock.json' \
              ':!.github/workflows/ci.yml'; then
            echo "Possibile segreto nei file tracciati"; exit 1
          fi
          echo "OK: nessun token noto"

      - name: Nessuna connection string con credenziali reali
        run: |
          # Solo URL che contengono davvero utente:password@host.
          #
          # Sono ammessi:
          #  - il placeholder USER:PASSWORD dei template;
          #  - qualunque host di loopback (127.0.0.1, ::1, localhost): non puo
          #    essere un database remoto, e li vivono il database di sviluppo
          #    in Docker e le connection string fittizie di test e CI.
          found=$(git grep -hoIE 'postgres(ql)?://[^:/@[:space:]]+:[^@[:space:]]+@[^[:space:]"]+' \
            -- . ':!package-lock.json' ':!easygamemobile/package-lock.json' \
            | grep -vE '://USER:PASSWORD@' \
            | grep -vE '@(127\.0\.0\.1|localhost|\[::1\])[:/]' || true)
          if [ -n "$found" ]; then
            echo "Connection string con credenziali verso un host remoto:"
            echo "$found"
            exit 1
          fi
          echo "OK: solo placeholder e host locali"

      - name: Il mobile non accede al database
        run: |
          if git grep -nI 'DATABASE_URL' -- easygamemobile; then
            echo "Il mobile deve usare solo le API EasyGame (ADR-0018)"; exit 1
          fi
          echo "OK: nessun riferimento a DATABASE_URL nel mobile"
